name: Finalize submission docs

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize_submission_docs.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PDF dependency
        run: python -m pip install --disable-pip-version-check reportlab

      - name: Update license wording
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          old = '> 음악은 YouTube Audio Library 안내가 영상 사용 중심이므로, 게임 공개 배포 권한은 제출 전 트랙별 라이선스 또는 권리자 허락 범위를 다시 확인해야 합니다.'
          new = '> 두 BGM은 YouTube Studio 오디오 보관함 라이선스 트랙으로 사용했으며, 저작자 표시는 필수가 아닙니다. 음악 파일 자체를 게임과 별도로 제공·배포하지 않습니다.'
          if old not in text:
              raise SystemExit('README.md: expected old license note not found')
          readme.write_text(text.replace(old, new), encoding='utf-8')

          submission = Path('SUBMISSION.md')
          text = submission.read_text(encoding='utf-8')
          old = '- [ ] 음악 2곡의 게임 공개 배포 사용 범위 확인'
          new = '- [x] 음악 2곡의 YouTube 오디오 보관함 라이선스 확인'
          if old not in text:
              raise SystemExit('SUBMISSION.md: expected music checklist item not found')
          submission.write_text(text.replace(old, new), encoding='utf-8')

          generator = Path('tools/submission/generate_submission_pdfs.py')
          text = generator.read_text(encoding='utf-8')
          old = '''            "<b>음악 라이선스 확인 사항</b><br/>YouTube Audio Library는 YouTube 영상 사용에 대한 안내가 중심이므로, "\n            "게임 자체의 공개 배포에 사용할 권리는 제출 전에 트랙별 라이선스 또는 권리자 허락 범위를 다시 확인해야 합니다. "\n            "이 문서는 음악의 소유권을 주장하지 않으며 작곡가 Rod Kim을 명시합니다.",'''
          new = '''            "<b>음악 라이선스</b><br/>Conspiracy Theory와 Final Boss Battle은 YouTube Studio 오디오 보관함에서 "\n            "제공되는 YouTube 오디오 보관함 라이선스 트랙입니다. 저작자 표시는 필수가 아니며, "\n            "본 프로젝트에서는 게임 내 BGM으로 포함해 사용합니다. 음악 파일 자체를 게임과 별도로 제공하거나 배포하지 않습니다.",'''
          if old not in text:
              raise SystemExit('PDF generator: expected old license callout not found')
          generator.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Regenerate submission PDFs
        run: python tools/submission/generate_submission_pdfs.py

      - name: Commit finalized documents
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md SUBMISSION.md tools/submission/generate_submission_pdfs.py output/pdf/BraveJourney_Game_Guide.pdf output/pdf/BraveJourney_AI_Usage_Report.pdf
          git commit -m "docs: finalize audio license note"
          git push
