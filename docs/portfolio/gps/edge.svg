<svg xmlns="http://www.w3.org/2000/svg" width="520" height="218" viewBox="0 0 520 218" role="img" aria-labelledby="title desc">
<title id="title">GPS 오차 범위가 현장 경계에 걸친 경우</title><desc id="desc">측정 지점은 현장 밖이지만 GPS 오차 범위 일부가 현장 안에 있습니다. 자동 퇴근은 보류합니다.</desc>
<defs>
 <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#d8e1da" stroke-width="1"/></pattern>
 <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#344d53"/></marker>
 <style>text{font-family:system-ui,'Malgun Gothic',sans-serif;fill:#263c40}.name{font-size:20px;font-weight:700}.small{font-size:16px;font-weight:600}.mono{font:700 20px monospace;fill:#223e43}</style>
</defs>
<path fill="#eff4ee" d="M0 0h520v218H0z"/><path fill="url(#grid)" d="M0 0h520v218H0z"/>
<g stroke-linecap="round" stroke-linejoin="round"><circle cx="161" cy="110" r="78" fill="#cde4d5" fill-opacity=".75" stroke="#427864" stroke-width="2.5" stroke-dasharray="6 5"/><text x="128" y="110" text-anchor="middle" class="name">현장 안</text><circle cx="246" cy="109" r="38" fill="#f0d4a3" fill-opacity=".62" stroke="#9b6631" stroke-width="2" stroke-dasharray="3 4"/><circle cx="246" cy="109" r="7" stroke="#fff" stroke-width="2.5" fill="#294e4d"/><path d="M286 109h48" fill="none" stroke="#344d53" stroke-width="3.5" marker-end="url(#arrow)"/><rect x="344" y="91" width="145" height="32" rx="5" fill="#ffedda" stroke="#7b422a" stroke-width="1.2"/><text x="416.5" y="113" text-anchor="middle" class="small" style="fill:#7b422a">퇴근 확인 필요</text><text x="251" y="179" text-anchor="middle" class="small">GPS 오차 범위</text><text x="158" y="22" text-anchor="middle" class="small">근무지 경계</text><text x="391" y="171" text-anchor="middle" class="small">자동 기록 보류</text></g></svg>