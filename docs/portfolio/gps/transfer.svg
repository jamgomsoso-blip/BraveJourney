<svg xmlns="http://www.w3.org/2000/svg" width="520" height="218" viewBox="0 0 520 218" role="img" aria-labelledby="title desc">
<title id="title">A현장 출근 후 B현장으로 이동</title><desc id="desc">08:00 A현장에서 출근하고 12:00에 이탈합니다. 12:30에 B현장 안으로 확인되면 퇴근 대기가 취소됩니다.</desc>
<defs>
 <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#d8e1da" stroke-width="1"/></pattern>
 <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#344d53"/></marker>
 <style>text{font-family:system-ui,'Malgun Gothic',sans-serif;fill:#263c40}.name{font-size:20px;font-weight:700}.small{font-size:16px;font-weight:600}.mono{font:700 20px monospace;fill:#223e43}</style>
</defs>
<path fill="#eff4ee" d="M0 0h520v218H0z"/><path fill="url(#grid)" d="M0 0h520v218H0z"/>
<g stroke-linecap="round" stroke-linejoin="round"><circle cx="88" cy="100" r="59" fill="#cde4d5" fill-opacity=".75" stroke="#427864" stroke-width="2.5" stroke-dasharray="6 5"/><circle cx="430" cy="100" r="59" fill="#cde4d5" fill-opacity=".75" stroke="#427864" stroke-width="2.5" stroke-dasharray="6 5"/><path d="M88 112H243Q253 112 259 104L270 89Q274 83 283 83H417" fill="none" stroke="#344d53" stroke-width="3.5" marker-end="url(#arrow)"/><circle cx="88" cy="112" r="7" stroke="#fff" stroke-width="2.5" fill="#294e4d"/><circle cx="430" cy="83" r="7" stroke="#fff" stroke-width="2.5" fill="#294e4d"/><text x="88" y="83" text-anchor="middle" class="name">A현장</text><text x="430" y="125" text-anchor="middle" class="name">B현장</text><rect x="174" y="30" width="166" height="32" rx="5" fill="#f9eed4" stroke="#76511f" stroke-width="1.2"/><text x="257" y="52" text-anchor="middle" class="small" style="fill:#76511f">A 이탈 · 퇴근 대기</text><rect x="343" y="169" width="162" height="32" rx="5" fill="#e4f1e6" stroke="#355f50" stroke-width="1.2"/><text x="424" y="191" text-anchor="middle" class="small" style="fill:#355f50">B 진입 · 대기 취소</text><text x="88" y="191" text-anchor="middle" class="small">08:00 출근</text><text x="246" y="156" text-anchor="middle" class="small">12:00 이탈</text><text x="428" y="151" text-anchor="middle" class="small">12:30</text></g></svg>