<svg xmlns="http://www.w3.org/2000/svg" width="520" height="218" viewBox="0 0 520 218" role="img" aria-labelledby="title desc">
<title id="title">마지막 현장 이탈 후 재확인</title><desc id="desc">17:00에 마지막 현장을 이탈합니다. 19:00에 모든 현장 밖임이 다시 확인되면 최초 이탈 시각 17:00을 퇴근으로 기록합니다.</desc>
<defs>
 <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#d8e1da" stroke-width="1"/></pattern>
 <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#344d53"/></marker>
 <style>text{font-family:system-ui,'Malgun Gothic',sans-serif;fill:#263c40}.name{font-size:20px;font-weight:700}.small{font-size:16px;font-weight:600}.mono{font:700 20px monospace;fill:#223e43}</style>
</defs>
<path fill="#eff4ee" d="M0 0h520v218H0z"/><path fill="url(#grid)" d="M0 0h520v218H0z"/>
<g stroke-linecap="round" stroke-linejoin="round"><circle cx="77" cy="106" r="49" fill="#cde4d5" fill-opacity=".75" stroke="#427864" stroke-width="2.5" stroke-dasharray="6 5"/><text x="77" y="97" text-anchor="middle" class="name">B현장</text><path d="M76 118h113" fill="none" stroke="#344d53" stroke-width="3.5" marker-end="url(#arrow)"/><circle cx="76" cy="118" r="7" stroke="#fff" stroke-width="2.5" fill="#294e4d"/><circle cx="213" cy="118" r="16" fill="#fff9e6" stroke="#88602f" stroke-width="2.6"/><path d="M213 109v10l6 3" stroke="#6e491c" stroke-width="2.6" fill="none"/><path d="M235 118H426" fill="none" stroke="#344d53" stroke-width="3.5" marker-end="url(#arrow)"/><circle cx="447" cy="118" r="7" stroke="#fff" stroke-width="2.5" fill="#294e4d"/><text x="215" y="83" text-anchor="middle" class="mono">17:00</text><text x="448" y="83" text-anchor="middle" class="mono">19:00</text><text x="216" y="162" text-anchor="middle" class="small">이탈 시각 저장</text><text x="440" y="162" text-anchor="middle" class="small">현장 밖 재확인</text><rect x="264" y="31" width="143" height="32" rx="5" fill="#f9eed4" stroke="#76511f" stroke-width="1.2"/><text x="335.5" y="53" text-anchor="middle" class="small" style="fill:#76511f">120분 후</text></g></svg>